name: YouTube Loop Stream

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "YouTube video link"
        required: true

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install -U yt-dlp

      - name: Download video
        env:
          VIDEO_URL: ${{ github.event.inputs.video_url }}
        run: yt-dlp -f "bv*[height<=1080]+ba/b" --merge-output-format mp4 -o video.mp4 "$VIDEO_URL"

      - name: Stream (portrait, loop)
        env:
          KEY: ${{ secrets.YT_STREAM_KEY }}
        run: |
          ffmpeg -re -stream_loop -1 -i video.mp4 \
            -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920" \
            -c:v libx264 -preset veryfast -b:v 4500k -maxrate 4500k -bufsize 9000k \
            -pix_fmt yuv420p -g 60 -r 30 \
            -c:a aac -b:a 128k -ar 44100 \
            -f flv "rtmp://a.rtmp.youtube.com/live2/$KEY"
